# Render Blueprint — Sistem Manajemen Warkop Kayu (Inventory)
#
# SETEL MANUAL setelah deploy (Environment → warkop-inventory):
#   APP_KEY              → php artisan key:generate --show (format base64:...)
#   APP_URL              → https://warkop-inventory.onrender.com
#   INVENTORY_API_TOKEN  → token rahasia (HARUS SAMA dengan pos-warkop-kayu)
#   POS_SERVICE_URL      → https://pos-warkop-kayu.onrender.com
#
# Deploy POS (repo uc_master-main) terpisah — salin External Database URL warkop-db ke service POS.
# Lihat DEPLOY.md bagian "Integrasi POS" dan DEPLOY.md di repo POS.

databases:
  - name: warkop-db
    databaseName: warkop_db
    user: warkop
    plan: free

services:
  - type: web
    name: warkop-inventory
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /login
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - app/**
        - bootstrap/**
        - config/**
        - database/**
        - docker/**
        - public/**
        - resources/**
        - routes/**
        - storage/**
        - Dockerfile
        - composer.json
        - composer.lock
        - package.json
        - package-lock.json
        - vite.config.js
        - render.yaml
    envVars:
      - key: APP_NAME
        value: Warkop Kayu Management
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: RENDER_REGION
        value: singapore
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: warkop-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: warkop-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: INVENTORY_API_TOKEN
        sync: false
      - key: INVENTORY_POS_USER_EMAIL
        value: pos-integration@system.local
      - key: POS_SERVICE_URL
        sync: false
